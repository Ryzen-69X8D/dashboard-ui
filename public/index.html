<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockFlow Auth</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="auth-shell login-theme" id="appShell">
      <section class="auth-card" aria-label="StockFlow authentication">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">S</div>
          <div>
            <h1>StockFlow</h1>
            <p>Smart Investing. Better Future.</p>
          </div>
        </div>

        <form class="auth-form" id="loginForm" novalidate>
          <header class="form-heading">
            <h2>Welcome Back</h2>
            <p>Sign in to your account to continue</p>
          </header>

          <label class="field">
            <span>Email Address</span>
            <input name="email" type="email" autocomplete="email" placeholder="Enter your email" required />
          </label>

          <label class="field">
            <span>Password</span>
            <input name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
          </label>

          <div class="form-row">
            <label class="checkbox">
              <input name="remember" type="checkbox" checked />
              <span>Remember me</span>
            </label>
            <button class="ghost-link" type="button" data-message="Password reset can be connected later.">Forgot password?</button>
          </div>

          <p class="message" id="loginMessage" role="status"></p>
          <button class="primary-button" type="submit">Login</button>

          <p class="switch-copy">Don't have an account? <button type="button" class="ghost-link" data-show="register">Register</button></p>
        </form>

        <form class="auth-form hidden" id="registerForm" novalidate>
          <header class="form-heading">
            <h2>Create Your Account</h2>
            <p>Join StockFlow and start your journey</p>
          </header>

          <label class="field">
            <span>Full Name</span>
            <input name="name" type="text" autocomplete="name" placeholder="Enter your full name" required />
          </label>

          <label class="field">
            <span>Email Address</span>
            <input name="email" type="email" autocomplete="email" placeholder="Enter your email" required />
          </label>

          <label class="field">
            <span>Password</span>
            <input name="password" type="password" autocomplete="new-password" placeholder="Create a password" required />
          </label>

          <label class="field">
            <span>Confirm Password</span>
            <input name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm your password" required />
          </label>

          <label class="checkbox terms">
            <input name="terms" type="checkbox" checked required />
            <span>I agree to the Terms of Service and Privacy Policy</span>
          </label>

          <p class="message" id="registerMessage" role="status"></p>
          <button class="primary-button green" type="submit">Register</button>

          <p class="switch-copy">Already have an account? <button type="button" class="ghost-link green-link" data-show="login">Login</button></p>
        </form>
      </section>

      <footer>&copy; 2024 StockFlow. All rights reserved.</footer>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
